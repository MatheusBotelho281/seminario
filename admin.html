<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Nova Notícia</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    </head>
  <body>
    <main>
      <div id="admin-form-container">
        <h1>Nova Publicação de Notícia</h1>
        <form id="form-noticia">
          <div class="form-group">
            <label for="titulo">Título da Notícia</label>
            <input
              type="text"
              id="titulo"
              required
              placeholder="Ex: Visita do Bispo"
            />
          </div>

          <div class="form-group">
            <label for="slug"
              >Slug (URL amigável - Gerado automaticamente)</label
            >
            <input
              type="text"
              id="slug"
              readonly
              title="Gerado automaticamente a partir do título."
            />
          </div>

          <div class="form-group">
            <label for="imagemURL">URL da Imagem de Capa</label>
            <input
              type="url"
              id="imagemURL"
              placeholder="https://exemplo.com/caminho/para/imagem.jpg"
              required
            />
          </div>

          <div class="form-group">
            <label for="resumo">Resumo (Chamada para o Index)</label>
            <textarea
              id="resumo"
              required
              maxlength="250"
              placeholder="Máximo de 250 caracteres. Este texto aparecerá na página inicial."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="conteudo"
              >Conteúdo Completo (Use tags HTML para formatação)</label
            >
            <textarea
              id="conteudo"
              required
              placeholder="Digite o corpo da notícia aqui. Use tags como <p>, <h2> e <strong> para formatar o texto."
            ></textarea>
          </div>

          <button type="submit" id="btn-publicar">Publicar Notícia</button>
          <p id="mensagem-status" style="display: none"></p>
        </form>
      </div>
    </main>

    <script>
      // Endpoint para o script PHP que salva o JSON
      const CMS_POST_ENDPOINT = './save_news.php';

      /**
       * Gera um slug (url amigável) a partir de uma string
       */
      function generateSlug(text) {
        return text
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '') // Remove acentos
          .trim()
          .replace(/\s+/g, '-') // Troca espaços por hífens
          .replace(/[^\w\-]+/g, '') // Remove caracteres não-alfanuméricos (exceto hífens)
          .replace(/\-\-+/g, '-'); // Remove hífens duplicados
      }

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('form-noticia');
        const titleInput = document.getElementById('titulo');
        const slugInput = document.getElementById('slug');
        const statusMessage = document.getElementById('mensagem-status');
        const publicarButton = document.getElementById('btn-publicar');

        // 1. Atualiza o slug em tempo real
        titleInput.addEventListener('input', () => {
          slugInput.value = generateSlug(titleInput.value);
        });

        // 2. Lógica de Envio do Formulário
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          // Desabilita o botão e mostra status
          publicarButton.disabled = true;
          publicarButton.textContent = 'Enviando...';
          statusMessage.style.display = 'block';
          statusMessage.style.color = 'blue';
          statusMessage.textContent = 'Preparando dados e conectando ao servidor...';

          // 3. Monta o payload (o objeto de dados)
          const noticiaPayload = {
            titulo: titleInput.value,
            slug: slugInput.value,
            imagemURL: document.getElementById('imagemURL').value,
            resumo: document.getElementById('resumo').value,
            conteudo: document.getElementById('conteudo').value,
            // Adiciona a data/hora exata da publicação
            dataPublicacao: new Date().toISOString(), 
          };

          try {
            // 4. Faz a requisição POST para o script PHP
            const response = await fetch(CMS_POST_ENDPOINT, {
              method: 'POST',
              headers: {
                // Indica ao PHP que o corpo da requisição é JSON
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(noticiaPayload),
            });

            // 5. Verifica o status da resposta
            const result = await response.json();

            if (response.ok && result.success) {
              statusMessage.textContent =
                '✅ Notícia publicada e arquivo JSON atualizado com sucesso!';
              statusMessage.style.color = 'green';
              // Limpa o formulário após sucesso
              form.reset(); 
              slugInput.value = ''; 
            } else {
              // Trata erros de requisição (e.g., PHP retornou 400 ou 500)
              statusMessage.style.color = 'red';
              statusMessage.textContent = `❌ Erro ao salvar notícia: ${
                result.message || response.statusText
              }. Verifique o console.`;
              console.error('Erro na resposta do servidor:', result);
            }
          } catch (error) {
            // Trata erros de rede (e.g., save_news.php não encontrado)
            statusMessage.style.color = 'red';
            statusMessage.textContent =
              '❌ Erro de rede. Verifique se o arquivo save_news.php está no local correto e se o servidor está ativo.';
            console.error('Erro durante a requisição:', error);
          } finally {
            // Reabilita o botão
            publicarButton.disabled = false;
            publicarButton.textContent = 'Publicar Notícia';
          }
        });
      });
    </script>
  </body>
</html>
